name: Build APK

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android command-line tools
        run: |
          mkdir -p "$ANDROID_HOME"
          curl -SL "https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip" -o /tmp/cmdline-tools.zip
          unzip -q -o /tmp/cmdline-tools.zip -d "$ANDROID_HOME"
          chmod +x "$ANDROID_HOME/cmdline-tools/bin/sdkmanager"

      - name: Accept Android SDK licenses
        run: echo "y" | yes | "$ANDROID_HOME/cmdline-tools/bin/sdkmanager" --licenses --sdk_root="$ANDROID_HOME" 2>/dev/null || true

      - name: Install Android SDK packages
        run: "$ANDROID_HOME/cmdline-tools/bin/sdkmanager" --install "platforms;android-34" "build-tools;34.0.0" --sdk_root="$ANDROID_HOME"

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x ./gradlew

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/wrapper-6
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30