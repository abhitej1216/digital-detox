name: Build APK

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /opt/android-sdk
      RELEASE_KEYSTORE_PATH: /tmp/keystore/digitaldetox.keystore
      RELEASE_STOREPASS: ${{ secrets.RELEASE_STOREPASS }}
      RELEASE_KEYPASS: ${{ secrets.RELEASE_KEYPASS }}
      RELEASE_KEY_ALIAS: digitaldetox
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools
          curl -SL "https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip" -o /tmp/cmdline-tools.zip
          unzip -q -o /tmp/cmdline-tools.zip -d $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools/cmdline-tools && yes | ./bin/sdkmanager --licenses
          ./bin/sdkmanager --install "platforms;android-34" "build-tools;34.0.0"

      - name: Install Gradle and generate wrapper
        run: |
          curl -SL "https://services.gradle.org/distributions/gradle-8.5-bin.zip" -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.5/bin/gradle wrapper --gradle-version 8.5 --no-daemon

      - name: Generate release keystore
        run: |
          mkdir -p /tmp/keystore
          keytool -genkey -v \
            -keystore $RELEASE_KEYSTORE_PATH \
            -storepass "$RELEASE_STOREPASS" \
            -keypass "$RELEASE_KEYPASS" \
            -alias digitaldetox \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Digital Detox,OU=Digital Detox,O=Digital Detox,L=Unknown,ST=Unknown,C=US"

      - name: Build release APK
        run: |
          unset ANDROID_SDK_ROOT
          ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        id: rename
        run: |
          APP_VERSION=$(grep versionName app/build.gradle.kts | sed -E 's/.*versionName *= *"([^"]+)".*/\1/')
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/digital-detox-${APP_VERSION}.apk
          echo "apk_path=app/build/outputs/apk/release/digital-detox-${APP_VERSION}.apk" >> $GITHUB_OUTPUT

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true

      - name: Upload APK to Latest Release
        if: github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag-name: latest
          name: Latest Release Build
          files: app/build/outputs/apk/release/app-release.apk